name: Daily TW Stock Screener

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 15:30 自動執行 (對應 UTC 時間 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 允許隨時手動點擊按鈕測試

permissions:
  contents: write

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install yfinance pandas requests

      - name: Run stock screener
        run: python scanner.py

      - name: Publish updated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新台股選股儀表板" && git push)
